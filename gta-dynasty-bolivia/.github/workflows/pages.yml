name: Deploy Frontend to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'gta-dynasty-bolivia/frontend/**'
      - 'gta-dynasty-bolivia/.github/workflows/pages.yml'
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd gta-dynasty-bolivia/frontend && npm ci && npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gta-dynasty-bolivia/frontend/dist
