spring.application.name=gta-dynasty-bolivia-backend
server.port=8080

spring.datasource.url=jdbc:h2:mem:dynastydb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Optional PostgreSQL override via env
# SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/dynasty
# SPRING_DATASOURCE_USERNAME=postgres
# SPRING_DATASOURCE_PASSWORD=postgres

app.jwt.secret=supersecretkeysupersecretkeysupersecretkey123
app.jwt.expiration=86400000
